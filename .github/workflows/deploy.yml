name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.58.114.91
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /var/www/house/deploy/deploy.sh
